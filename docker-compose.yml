services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://ams_app:${APP_DB_PASSWORD:-ams_app}@db:5432/ams
      MIGRATION_DATABASE_URL: postgres://ams:${POSTGRES_PASSWORD:-ams}@db:5432/ams
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ams-attachments
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ams}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ams-secret}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  # Built from Task 21 onward, when the TailAdmin template is copied to web/.
  # Until it exists, `docker compose up` would fail on a missing build context,
  # so the service sits behind a profile and is opted into explicitly:
  #   docker compose --profile web up
  # Delete the profile line once web/ exists, so the default up brings up
  # everything as the global constraints require.
  web:
    profiles: ["web"]
    build: ./web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports: ["3000:80"]
    depends_on: [api]

  # Object storage for attachments (Task 11). S3-compatible, so production can
  # swap in real S3 by changing the endpoint and credentials only.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ams}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ams-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  minio_data:
