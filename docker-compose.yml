services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
    # Published port is configurable: a machine with PostgreSQL already
    # installed is listening on 5432, and connections then reach that one
    # instead of this container - which fails as a password error and looks
    # like a wrong credential rather than a wrong server.
    ports: ["${DB_PORT:-5442}:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      args:
        # Stamped by the release pipeline; "unknown" locally, which is honest.
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      DATABASE_URL: postgres://ams_app:${APP_DB_PASSWORD:-ams_app}@db:5432/ams
      MIGRATION_DATABASE_URL: postgres://ams:${POSTGRES_PASSWORD:-ams}@db:5432/ams
      # Passed through so the migration runner can set the application role's
      # password. Migration 004 creates ams_app with no password precisely so
      # that this value, and not a literal in the SQL, is the credential.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ams_app}
      # The platform console's connection. Deliberately absent from the jobs
      # service: the scheduler has no business reading across tenants.
      PLATFORM_DATABASE_URL: postgres://ams_platform:${PLATFORM_DB_PASSWORD:-ams_platform}@db:5432/ams
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-ams_platform}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set - see .env.example}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3400}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ams-attachments
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ams}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ams-secret}
      # Database archives live apart from customer attachments: different
      # retention, different access, different blast radius.
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-ams-backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    ports: ["${API_PORT:-4400}:4000"]
    depends_on:
      db: { condition: service_healthy }

  # The scheduler: overdue chases, expiry notices, and draining the email
  # outbox. Shares the api image - same code, different entrypoint - so there is
  # no second build and no chance of the two drifting apart.
  jobs:
    build: ./api
    command: ["node", "dist-scripts/jobs.js"]
    environment:
      DATABASE_URL: postgres://ams_app:${APP_DB_PASSWORD:-ams_app}@db:5432/ams
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3400}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set - see .env.example}
      JOB_INTERVAL_MS: ${JOB_INTERVAL_MS:-900000}
      EXPIRY_WINDOW_DAYS: ${EXPIRY_WINDOW_DAYS:-90}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ams-attachments
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ams}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ams-secret}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./web
      # Vite inlines the API base at build time, so it is a build arg rather
      # than a runtime environment variable.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    ports: ["${WEB_PORT:-3400}:80"]
    depends_on: [api]

  # Object storage for attachments (Task 11). S3-compatible, so production can
  # swap in real S3 by changing the endpoint and credentials only.
  minio:
    # Pinned, and pinned to the same tag CI runs. `latest` is what broke CI the
    # first time it ever ran: the image it named had been withdrawn.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ams}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ams-secret}
    ports: ["${MINIO_PORT:-9400}:9000", "${MINIO_CONSOLE_PORT:-9401}:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  minio_data:
