services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams_test
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams_test"]
      interval: 3s
      timeout: 3s
      retries: 10
