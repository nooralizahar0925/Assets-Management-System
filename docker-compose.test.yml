services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams_test
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams
    # Overridable, because a developer machine may
    # already have something on it. Set TEST_DB_PORT to match in the shell that
    # runs the tests, or put it in .env.
    ports: ["${TEST_DB_PORT:-5443}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams_test"]
      interval: 3s
      timeout: 3s
      retries: 10
