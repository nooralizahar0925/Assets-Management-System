server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-lived hashed assets. Vite fingerprints filenames, so a stale cache is
  # impossible and a year is safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy leaves browsers loading the
  # previous build's asset names.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # The API is served under this same origin. Cross-origin would need CORS on
  # the API and would trip its CSRF origin check, so one host serves both.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Attachments and spreadsheet imports are larger than nginx's 1 MB default.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # Client-side routing: any unknown path is a react-router route, not a 404.
  # A scanned QR code hitting /a/AMS-000123 has to reach the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
