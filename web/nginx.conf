server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never redirect to a host and port of nginx's own invention.
  #
  # nginx builds a redirect from $host, which inside the container is port 80.
  # Served on any other port - :3000 in compose - that sends the browser to a
  # different server entirely. On this machine it landed on a local Apache,
  # which answered 404 and made the application look broken.
  absolute_redirect off;
  port_in_redirect off;

  # Long-lived hashed build output. Vite fingerprints filenames, so a stale
  # cache is impossible and a year is safe.
  #
  # Matched by extension rather than by the /assets/ prefix, because /assets is
  # also one of the application's own routes - the register. A prefix rule
  # swallowed /assets/<uuid> and answered 404 for every deep link to an asset,
  # while client-side navigation to the same page worked, which is the sort of
  # difference nobody notices until a customer sends a link to a colleague.
  location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy leaves browsers loading the
  # previous build's asset names.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # The API is served under this same origin. Cross-origin would need CORS on
  # the API and would trip its CSRF origin check, so one host serves both.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Attachments and spreadsheet imports are larger than nginx's 1 MB default.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # Client-side routing: any unknown path is a react-router route, not a 404.
  # A scanned QR code hitting /a/AMS-000123 has to reach the app.
  #
  # No $uri/ in the list. It makes nginx look for a directory, and finding one -
  # the build output really does contain assets/ - it answers with a redirect
  # rather than the application.
  location / {
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
